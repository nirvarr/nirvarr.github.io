- role: Graduate Researcher, Universiti Malaya
  type: Research
  years: 2025 to 2026
  place: Background bias in CNN-based golden berry ripeness classification
  bullets:
    - Built a 1,124-image ripe/unripe golden berry dataset from web sources and original photography; deduplicated it with perceptual hashing, hand-labelled it, split it 70:15:15 and corrected class imbalance.
    - Fine-tuned ResNet50 (98.8% accuracy) and MobileNetV2 (97.7%) and trained a custom CNN from scratch (97.7%); showed that a shape-blind colour-histogram baseline reached 95.9%, under 3 points behind the best CNN.
    - "Designed a background-randomisation control (segmented fruit composited onto label-independent backgrounds): the baseline fell to 82.5% while pretrained CNNs held 94.2%, widening ResNet50's margin over the baseline from 2.9 to 11.7 points (p < 0.01)."
